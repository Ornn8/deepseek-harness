name: Agent Recovery

on:
  workflow_run:
    workflows: [Agent Issues, Agent PR Rework, Agent PR Review]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

jobs:
  recover:
    if: >-
      contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion)
      && github.event.workflow_run.name != github.workflow
    uses: Ornn8/dsh-agent-automation/.github/workflows/recover-backlog.yml@a197c461aaabaf9d782fb0dced43b01d0e12963a
    with:
      source_run_id: ${{ github.event.workflow_run.id }}
