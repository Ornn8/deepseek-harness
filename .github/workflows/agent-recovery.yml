name: Agent Recovery

on:
  workflow_run:
    workflows: [Agent Issues, Agent PR Rework, Agent PR Review]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.name != github.workflow
    uses: Ornn8/dsh-agent-automation/.github/workflows/recover-backlog.yml@9294448e7ee8d7628ee828d0980162e894e26b63
    with:
      source_run_id: ${{ github.event.workflow_run.id }}
