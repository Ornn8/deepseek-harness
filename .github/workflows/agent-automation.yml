name: Agent Automation

on:
  push:
    branches: [master]
  workflow_dispatch:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  repository_dispatch:
    types: [dsh-repair]

permissions:
  contents: read

jobs:
  dsh-backlog:
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues' && contains(fromJSON('["opened","reopened"]'), github.event.action))
      || (github.event_name == 'issues'
        && github.event.action == 'labeled'
        && github.event.label.name == 'agent/dsh-failed')
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@358258889e39e6ad1d7c4d46cbcf8fe197b3ddb6
    with:
      repository: ${{ github.repository }}
      controller_sha: 358258889e39e6ad1d7c4d46cbcf8fe197b3ddb6

  dsh-issue:
    if: >-
      github.event_name == 'issues'
      && github.event.label.name == 'agent/dsh'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    uses: Ornn8/dsh-agent-automation/.github/workflows/dsh-issue.yml@358258889e39e6ad1d7c4d46cbcf8fe197b3ddb6
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      controller_sha: 358258889e39e6ad1d7c4d46cbcf8fe197b3ddb6

  dsh-comment-rework:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && (startsWith(github.event.comment.body, '@dsh ')
        || startsWith(github.event.comment.body, 'DSH: '))
    uses: Ornn8/dsh-agent-automation/.github/workflows/wake-rework.yml@358258889e39e6ad1d7c4d46cbcf8fe197b3ddb6
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.issue.number }}
      comment_id: ${{ github.event.comment.id }}
      controller_sha: 358258889e39e6ad1d7c4d46cbcf8fe197b3ddb6

  codex-review:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'labeled' || github.event.label.name == 'automation/review-ready')
    uses: Ornn8/dsh-agent-automation/.github/workflows/codex-review.yml@358258889e39e6ad1d7c4d46cbcf8fe197b3ddb6
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.pull_request.number }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      controller_sha: 358258889e39e6ad1d7c4d46cbcf8fe197b3ddb6

  dsh-repair:
    if: >-
      (github.event_name == 'pull_request'
        && github.event.action == 'labeled'
        && github.event.label.name == 'automation/review-blocked'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository)
      || github.event_name == 'repository_dispatch'
    uses: Ornn8/dsh-agent-automation/.github/workflows/dsh-repair.yml@358258889e39e6ad1d7c4d46cbcf8fe197b3ddb6
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number || github.event.pull_request.number }}
      head_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event.pull_request.head.sha }}
      request_id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.request_id || '' }}
      controller_sha: 358258889e39e6ad1d7c4d46cbcf8fe197b3ddb6
