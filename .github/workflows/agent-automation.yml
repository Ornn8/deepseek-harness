name: Agent Automation

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  dsh-issue:
    if: >-
      github.event_name == 'issues'
      && github.event.label.name == 'agent/dsh'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    uses: Ornn8/dsh-agent-automation/.github/workflows/dsh-issue.yml@30545c5313d8181bd6f9bf214431edbbc24a8031
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      controller_sha: 30545c5313d8181bd6f9bf214431edbbc24a8031

  codex-review:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'labeled' || github.event.label.name == 'automation/review-ready')
    uses: Ornn8/dsh-agent-automation/.github/workflows/codex-review.yml@30545c5313d8181bd6f9bf214431edbbc24a8031
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.pull_request.number }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      controller_sha: 30545c5313d8181bd6f9bf214431edbbc24a8031

  dsh-repair:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'labeled'
      && github.event.label.name == 'automation/review-blocked'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: Ornn8/dsh-agent-automation/.github/workflows/dsh-repair.yml@30545c5313d8181bd6f9bf214431edbbc24a8031
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      controller_sha: 30545c5313d8181bd6f9bf214431edbbc24a8031
