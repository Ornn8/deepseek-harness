name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: write

jobs:
  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@1921be278e3b48650d4cb717e857ef71f5fc6a96
    with:
      required_checks_json: ${{ vars.DSH_AUTOMATION_REQUIRED_CHECKS }}
