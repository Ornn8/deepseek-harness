name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: write

jobs:
  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@9f984bb552f16972a8d81d6775ae54280441bab1
    with:
      required_checks_json: ${{ vars.DSH_AUTOMATION_REQUIRED_CHECKS }}
