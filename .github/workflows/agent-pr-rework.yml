name: Agent PR Rework

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  repository_dispatch:
    types: [dsh-repair]

permissions:
  contents: read

jobs:
  dsh-comment-rework:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && (startsWith(github.event.comment.body, '@dsh ')
        || startsWith(github.event.comment.body, 'DSH: '))
    uses: Ornn8/dsh-agent-automation/.github/workflows/wake-rework.yml@f084384617a5db8bbe5c8c96ddf86d7b10f4291c
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.issue.number }}
      comment_id: ${{ github.event.comment.id }}
      controller_sha: f084384617a5db8bbe5c8c96ddf86d7b10f4291c

  dsh-review-feedback:
    if: >-
      (github.event_name == 'pull_request_review'
        && github.event.review.state == 'changes_requested'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      || (github.event_name == 'pull_request_review_comment'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    uses: Ornn8/dsh-agent-automation/.github/workflows/wake-feedback.yml@f084384617a5db8bbe5c8c96ddf86d7b10f4291c
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.pull_request.number }}
      feedback_kind: ${{ github.event_name == 'pull_request_review' && 'review' || 'review-comment' }}
      feedback_id: ${{ github.event_name == 'pull_request_review' && github.event.review.id || github.event.comment.id }}
      controller_sha: f084384617a5db8bbe5c8c96ddf86d7b10f4291c

  dsh-repair:
    if: >-
      github.event_name == 'repository_dispatch'
      || (github.event_name == 'pull_request'
        && github.event.action == 'labeled'
        && github.event.label.name == 'automation/review-blocked'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository)
    uses: Ornn8/dsh-agent-automation/.github/workflows/dsh-repair.yml@f084384617a5db8bbe5c8c96ddf86d7b10f4291c
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number || github.event.pull_request.number }}
      head_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event.pull_request.head.sha }}
      request_id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.request_id || format('codex-{0}-{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
      controller_sha: f084384617a5db8bbe5c8c96ddf86d7b10f4291c
