name: Agent Issues

on:
  push:
    branches: [master]
  workflow_dispatch:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: read

jobs:
  dsh-backlog:
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues' && contains(fromJSON('["opened","reopened"]'), github.event.action))
      || (github.event_name == 'issues'
        && github.event.action == 'labeled'
        && github.event.label.name == 'agent/dsh-failed')
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@d5df4e3263a9a0728bdee25f51d9d2b8a6e601f1
    with:
      repository: ${{ github.repository }}
      controller_sha: d5df4e3263a9a0728bdee25f51d9d2b8a6e601f1

  dsh-issue:
    if: >-
      github.event_name == 'issues'
      && github.event.label.name == 'agent/dsh'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    uses: Ornn8/dsh-agent-automation/.github/workflows/dsh-issue.yml@d5df4e3263a9a0728bdee25f51d9d2b8a6e601f1
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      controller_sha: d5df4e3263a9a0728bdee25f51d9d2b8a6e601f1
      worker_id: dsh
      runner_labels_json: '["self-hosted","Windows","X64","agent-change"]'

  reconcile-reviews:
    if: github.event_name == 'push'
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@d5df4e3263a9a0728bdee25f51d9d2b8a6e601f1
    with:
      repository: ${{ github.repository }}
      controller_sha: d5df4e3263a9a0728bdee25f51d9d2b8a6e601f1
