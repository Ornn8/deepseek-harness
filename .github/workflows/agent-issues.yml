name: Agent Issues

on:
  push:
  workflow_dispatch:
  repository_dispatch:
    types: [dsh-issue]
  issues:
    types: [opened, reopened, edited, closed, labeled]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  dsh-backlog:
    if: >-
      (github.event_name == 'push'
        && github.ref_name == github.event.repository.default_branch)
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues' && contains(fromJSON('["opened","reopened","edited","closed"]'), github.event.action))
      || (github.event_name == 'issues'
        && github.event.action == 'labeled'
        && github.event.label.name == 'agent/dsh-failed')
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@b2af642081fa71adb6a57a37dbe3bf3f58a34c15

  dsh-issue:
    if: >-
      github.event_name == 'repository_dispatch'
      || (github.event_name == 'issues'
        && github.event.action == 'labeled'
        && github.event.label.name == 'agent/dsh'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    uses: Ornn8/dsh-agent-automation/.github/workflows/dsh-issue.yml@b2af642081fa71adb6a57a37dbe3bf3f58a34c15
    with:
      issue_number: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.issue_number || github.event.issue.number }}
      request_id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.request_id || format('label-{0}-{1}', github.run_id, github.run_attempt) }}

  reconcile-reviews:
    if: >-
      github.event_name == 'push'
      && github.ref_name == github.event.repository.default_branch
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@b2af642081fa71adb6a57a37dbe3bf3f58a34c15
