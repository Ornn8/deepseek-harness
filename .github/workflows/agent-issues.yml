name: Agent Issues

on:
  push:
  workflow_dispatch:
  issues:
    types: [opened, reopened, labeled]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  dsh-backlog:
    if: >-
      (github.event_name == 'push'
        && github.ref_name == github.event.repository.default_branch)
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues' && contains(fromJSON('["opened","reopened"]'), github.event.action))
      || (github.event_name == 'issues'
        && github.event.action == 'labeled'
        && github.event.label.name == 'agent/dsh-failed')
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@a6055e724fa9b66f0b84b67cd66faf5102a9545a

  dsh-issue:
    if: >-
      github.event_name == 'issues'
      && github.event.label.name == 'agent/dsh'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    uses: Ornn8/dsh-agent-automation/.github/workflows/dsh-issue.yml@a6055e724fa9b66f0b84b67cd66faf5102a9545a
    with:
      issue_number: ${{ github.event.issue.number }}

  reconcile-reviews:
    if: >-
      github.event_name == 'push'
      && github.ref_name == github.event.repository.default_branch
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@a6055e724fa9b66f0b84b67cd66faf5102a9545a
