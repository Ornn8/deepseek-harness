name: Agent PR Landing

on:
  repository_dispatch:
    types: [dsh-land]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: write

jobs:
  land-reviewed-pr:
    if: >-
      github.event_name == 'repository_dispatch'
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.name == vars.DSH_AUTOMATION_CI_WORKFLOW
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.pull_requests[0].number != null)
    uses: Ornn8/dsh-agent-automation/.github/workflows/land-pr.yml@ab8ec700bee21e09e389849aa3a588ec745def07
    with:
      pull_request_number: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number || github.event.workflow_run.pull_requests[0].number }}
      head_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event.workflow_run.head_sha }}
