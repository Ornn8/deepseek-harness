name: Agent PR Landing

on:
  repository_dispatch:
    types: [dsh-land]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  land-reviewed-pr:
    if: >-
      github.event_name == 'repository_dispatch'
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.pull_requests[0].number != null)
    uses: Ornn8/dsh-agent-automation/.github/workflows/land-pr.yml@9d7a82e8ddd90f0260097112241e9273d0a7a18c
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number || github.event.workflow_run.pull_requests[0].number }}
      head_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event.workflow_run.head_sha }}
      controller_sha: 9d7a82e8ddd90f0260097112241e9273d0a7a18c
