name: Agent PR CI Repair

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  dsh-ci-repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.pull_requests[0].number != null
    uses: Ornn8/dsh-agent-automation/.github/workflows/dsh-repair.yml@21314cce10e0c3e36a710647bc129186d0899e04
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      request_id: ${{ format('ci-run-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
      controller_sha: 21314cce10e0c3e36a710647bc129186d0899e04
