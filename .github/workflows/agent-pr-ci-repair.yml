name: Agent PR CI Repair

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  dsh-ci-repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.pull_requests[0].number != null
    uses: Ornn8/dsh-agent-automation/.github/workflows/dsh-repair.yml@beb99e7acc1e42a168cbfb3c2cbdc42d7a8eb2de
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      request_id: ${{ format('ci-run-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
      controller_sha: beb99e7acc1e42a168cbfb3c2cbdc42d7a8eb2de
      worker_id: dsh
      runner_labels_json: '["self-hosted","Windows","X64","agent-change"]'
