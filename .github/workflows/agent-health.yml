name: Agent Pipeline Health

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
    - cron: '29 3 * * *'

permissions:
  actions: read
  contents: read

jobs:
  review-worker:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '29 3 * * *'
    name: review worker
    uses: Ornn8/dsh-agent-automation/.github/workflows/pipeline-health.yml@1921be278e3b48650d4cb717e857ef71f5fc6a96
    with:
      role: review
      readiness_canary: ${{ github.event.schedule == '29 3 * * *' }}

  change-worker:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '29 3 * * *'
    name: change worker
    uses: Ornn8/dsh-agent-automation/.github/workflows/pipeline-health.yml@1921be278e3b48650d4cb717e857ef71f5fc6a96
    with:
      role: change
      readiness_canary: ${{ github.event.schedule == '29 3 * * *' }}

  hosted-watchdog:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: hosted queue watchdog
    uses: Ornn8/dsh-agent-automation/.github/workflows/runner-watchdog.yml@1921be278e3b48650d4cb717e857ef71f5fc6a96
