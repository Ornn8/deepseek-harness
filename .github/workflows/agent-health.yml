name: Agent Pipeline Health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-worker:
    name: review worker
    uses: Ornn8/dsh-agent-automation/.github/workflows/pipeline-health.yml@beb99e7acc1e42a168cbfb3c2cbdc42d7a8eb2de
    with:
      repository: ${{ github.repository }}
      controller_sha: beb99e7acc1e42a168cbfb3c2cbdc42d7a8eb2de
      worker_id: codex
      runner_labels_json: '["self-hosted","Windows","X64","agent-reviewer"]'

  change-worker:
    name: change worker
    uses: Ornn8/dsh-agent-automation/.github/workflows/pipeline-health.yml@beb99e7acc1e42a168cbfb3c2cbdc42d7a8eb2de
    with:
      repository: ${{ github.repository }}
      controller_sha: beb99e7acc1e42a168cbfb3c2cbdc42d7a8eb2de
      worker_id: dsh
      runner_labels_json: '["self-hosted","Windows","X64","agent-change"]'
