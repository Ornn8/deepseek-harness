- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
          thinking: disabled
          # Wider than the mock's 60ms keep-alive cadence by an order of
          # magnitude: the snapshot proves comments rearm the idle watchdog
          # (the keep-alive span exceeds this timeout), while a loaded CI event
          # loop used to slip past the old 150ms margin and turn the single
          # request into a retried pair.
          streamIdleTimeoutMs: 1000
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless DeepSeek adapter defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'
