# The pwsh terminal-card lane swaps the shipped bash stack for the PowerShell
# twin: the bash executor row is disabled (patches cannot rename a row — `name`
# is a guard), the unconfined pwsh executor is inserted, and the tool row the
# web-app bundle disabled is re-enabled in place — inserting a fresh `tool-pwsh`
# row would collide with the shipped id and the Loader rejects the duplicate.
# The shipped sandboxed pwsh executor is disabled too: two `shell` providers
# cannot both mount, and this lane renders a seeded session, never a confined
# execution. The permission service refuses an unconfined executor by design
# (presets bundle a sandbox mode), so its row is disabled as well — this lane
# renders a seeded session, never a permission decision. The seeded scenario
# renders the logged pwsh call/result through the real tools on replay; no
# command executes, but the composition must boot the pwsh executor, so the
# lane skips on hosts without a usable `pwsh`.
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: true
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: true
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  disabled: true
- insert:
    - id: pwsh-local
      name: '@deepseek-ai/dsh-pwsh-local'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: false
